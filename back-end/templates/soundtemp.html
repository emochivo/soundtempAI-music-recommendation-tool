<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SoundTemp</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .main {
      flex: 3;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .top-section {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      flex: 1;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      min-height: 140px;
    }

    .playlists {
      margin-top: 20px;
    }

    .playlist-grid {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .playlist-item {
      width: 120px;
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }

    .playlist-item img {
      width: 100%;
      border-radius: 8px;
    }

    .player {
      flex: 1;
      background: #ffffff;
      border-left: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 35px 25px;
      gap: 14px;
    }

    .album-art {
      width: 190px;
      height: 190px;
      background: #ccc;
      border-radius: 18px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .song-info {
      text-align: center;
    }

    .song-info h3,
    .song-info p {
      margin: 6px 0;
    }

    .spotify-link {
      text-decoration: none;
      color: white;
      background: #1DB954;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .spotify-embed {
      width: 100%;
      max-width: 320px;
      height: 80px;
      border-radius: 12px;
    }

    /* .controls button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 24px;
      margin: 10px;
    } */

  </style>
</head>

<body>

<div class="container">

  <!-- LEFT SIDE -->
  <div class="main">
    <h1>SoundTemp</h1>

    <div class="top-section">

      <!-- Weather -->
      <div class="card" id="weather">
        <h3>Weather Data</h3>
        <p>Loading...</p>
      </div>

      <!-- Recommended -->
      <div class="card" id="playlist">
        <h3>Recommended Playlist</h3>
        <p>Loading...</p>
      </div>

    </div>

    <!-- More playlists -->
    <div class="playlists">
      <h3>More Songs</h3>
      <div class="playlist-grid" id="more-playlists"></div>
    </div>
  </div>

  <!-- RIGHT SIDE PLAYER -->
  <div class="player">
    <div class="album-art" id="album-art"></div>

    <div class="song-info">
      <h3 id="song-title">Select a song</h3>
      <p id="song-artist"></p>
    </div>

    <a id="spotify-link" href="#" target="_blank" class="spotify-link">
      Open in Spotify
    </a>

    <iframe
      id="spotify-player"
      class="spotify-embed"
      src=""
      width="100%"
      height="80"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>

</div>


<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
