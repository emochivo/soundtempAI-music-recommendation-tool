<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SoundTemp</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffe8be;
    }

    .title {
      font-family: "Nanum Pen Script", cursive;
      font-weight: 400;
      font-style: normal;
      font-size: 80px;
      color: #406aaf;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .sub-header {
      font-family: "Nanum Pen Script", cursive;
      font-weight: 400;
      font-style: normal;
      font-size: 40px;
      color: #406aaf;
      margin-bottom: 10px;
    }

    .container {
      display: flex;
      min-height: 100vh;
      padding-bottom: 40px;
      box-sizing: border-box;
    }

    .main {
      flex: 0 0 850px;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .top-section {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      flex: 1;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      min-height: 140px;
      /* max-width: 38%; */
      border: 2px solid #406aaf;
    }

    .card-title {
      font-family: 'Nanum Pen Script', cursive; 
      font-weight: 400; 
      font-style: normal; 
      font-size: 30px;
      margin-top: 5px;
      margin-bottom: 10px;
      color: #406aaf;
      font-weight: bold;
    }

    .playlists {
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .playlist-grid {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .playlist-item {
      width: 120px;
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }

    .playlist-item img {
      width: 100%;
      border-radius: 8px;
    }

    .player {
      /* flex: 1; */
      flex: 0 0 360px;
      background: #406aaf;
      border-left: 1px solid #ddd;
      border-radius: 45px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 35px 25px;
      gap: 14px;
      margin: 100px auto 0 auto;
      height: 600px;
      color: white;
      box-shadow: 0 12px 10px rgba(0,0,0,0.1);
    }

    .album-art {
      width: 200px;
      height: 200px;
      background: #ccc;
      background-size: cover;
      background-position: center;
      border: 4px solid #f7dd7d;
      margin-top: 40px;
    }

    .song-info {
      text-align: center;
    }

    .song-info h3,
    .song-info p {
      margin: 6px 0;
    }

    .spotify-link {
      text-decoration: none;
      color: white;
      background: #1DB954;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .spotify-embed {
      width: 100%;
      max-width: 320px;
      height: 80px;
      border-radius: 12px;
    }

    /* .controls button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 24px;
      margin: 10px;
    } */

  </style>
</head>

<body>

<div class="container">

  <!-- LEFT SIDE -->
  <div class="main">
    <h1 class="title">SoundTemp</h1>

    <div class="top-section">

      <!-- Weather -->
      <div class="card">
        <h3 class="card-title">
          Weather
        </h3>
        <div id="weather">
          <p>Loading...</p>
        </div>
      </div>

      <!-- Recommended -->
      <div class="card">
        <h3 class="card-title">
          Recommended
        </h3>
        <div id="playlist">
          <p>Loading...</p>
        </div>
      </div>

    </div>

    <!-- More playlists -->
    <div class="playlists">
      <h3 class="sub-header">Songs with the same vibe</h3>
      <div class="playlist-grid" id="more-playlists"></div>
    </div>
  </div>

  <!-- RIGHT SIDE PLAYER -->
  <div class="player">
    <div class="album-art" id="album-art"></div>

    <div class="song-info">
      <h3 id="song-title">Select a song</h3>
      <p id="song-artist"></p>
    </div>

    <a id="spotify-link" href="#" target="_blank" class="spotify-link">
      Open in Spotify
    </a>

    <iframe
      id="spotify-player"
      class="spotify-embed"
      src=""
      width="100%"
      height="80"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>

</div>


<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
